# Curated allowlist for S14 `app-caches`.
#
# Principle 1: allowlist, never blocklist. An unlisted bundle ID is NEVER
# touched, regardless of size. There is no wildcard over ~/Library/Caches and
# adding one would be a spec violation — the PRD rates blanket cache deletion
# as a High-severity risk, and this file is the mitigation.
#
# Every entry must state:
#   bundle_id     the directory name under ~/Library/Caches
#   subpaths      specific subdirectories, or ["."] for the whole cache dir
#   min_age_days  floor for this entry
#   note          what regenerating actually costs the user
#
# The note is required and enforced by a test. If nobody can explain what is
# lost, the entry does not belong here.

# --- Browsers ---------------------------------------------------------------
# HTTP and code caches only. Never Local Storage, IndexedDB, cookies, or
# profile data — those are user state, not cache.

[[entry]]
bundle_id = "com.google.Chrome"
subpaths = ["Default/Cache", "Default/Code Cache"]
min_age_days = 14
note = "Browser HTTP and compiled-JS cache; regenerates as you browse. Logins and history are untouched."

[[entry]]
bundle_id = "com.microsoft.edgemac"
subpaths = ["Default/Cache", "Default/Code Cache"]
min_age_days = 14
note = "Browser HTTP and compiled-JS cache; regenerates as you browse."

[[entry]]
