name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  # Enforcement for G4: "no network access, no telemetry". The PRD's promise
  # that sift makes zero outbound connections is only credible if it is
  # mechanically enforced, so this is a required check rather than a convention.
  deps:
    name: dependency audit
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/audit-deps.sh

  # Apple Silicon only — x86_64-apple-darwin is not a supported target, so there
  # is no build matrix, no universal binary, and no `lipo` step in the release
  # pipeline (PR-44).
  build:
    name: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target aarch64-apple-darwin

      # PR-01 exit criterion: `sift --version` prints the crate version.
      - name: Verify --version
        run: |
          set -euo pipefail
          expected="sift $(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          actual="$(./target/aarch64-apple-darwin/release/sift --version)"
          echo "expected: $expected"
          echo "actual:   $actual"
          [ "$expected" = "$actual" ]

      # Guards the arm64-only decision. `strip` preserves the linker's ad-hoc
      # signature on current toolchains (measured, see PR plan C7); assert that
      # rather than assume it, since PR-44's release pipeline depends on it.
      - name: Verify ad-hoc signature survives strip
        run: |
          set -euo pipefail
          cp target/aarch64-apple-darwin/release/sift /tmp/sift-stripped
          strip /tmp/sift-stripped
          codesign -v -vv /tmp/sift-stripped
          /tmp/sift-stripped --version

  msrv:
    name: msrv
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the *development* toolchain. This job verifies
      # the separately declared MSRV (`rust-version` in Cargo.toml) actually
      # builds, which is the PR-01 exit criterion. Removing the pin file is the
      # only way to install a different channel in this checkout.
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          rm -f rust-toolchain.toml
          msrv="$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
          echo "MSRV is $msrv"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}
      - run: cargo build --all-features
